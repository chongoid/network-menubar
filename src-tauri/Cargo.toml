[package]
name = "network-menubar"
version = "1.4.0"
description = "Shows network machines in your macOS menu bar"
authors = ["Sebastian Alsina"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
parking_lot = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]
