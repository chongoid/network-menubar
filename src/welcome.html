<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Network Menubar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: rgba(255, 255, 255, 0.85);
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: rgba(28, 28, 36, 0.95);
      }
    }

    .window-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      .window-header {
        border-bottom-color: rgba(255, 255, 255, 0.08);
      }
    }

    .window-title {
      font-size: 11px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.4);
      -webkit-app-region: drag;
    }

    @media (prefers-color-scheme: dark) {
      .window-title {
        color: rgba(255, 255, 255, 0.4);
      }
    }

    .close-btn {
      position: absolute;
      top: 4px;
      right: 12px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      -webkit-app-region: no-drag;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn::before, .close-btn::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 1.5px;
      background: rgba(0, 0, 0, 0.6);
    }

    .close-btn::before { transform: rotate(45deg); }
    .close-btn::after { transform: rotate(-45deg); }

    @media (prefers-color-scheme: dark) {
      .close-btn {
        background: rgba(0, 0, 0, 0.3);
      }
      .close-btn::before, .close-btn::after {
        background: rgba(255, 255, 255, 0.6);
      }
    }

    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    @media (prefers-color-scheme: dark) {
      h1 { color: #fff; }
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(0, 0, 0, 0.55);
      max-width: 320px;
      margin-bottom: 32px;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle { color: rgba(255, 255, 255, 0.55); }
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.7);
      margin-bottom: 28px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    @media (prefers-color-scheme: dark) {
      .checkbox-label { color: rgba(255, 255, 255, 0.7); }
    }

    .checkbox-label input {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.8);
    }

    .checkbox-label input:checked {
      background: #0a84ff;
      border-color: #0a84ff;
    }

    .checkbox-label input:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    @media (prefers-color-scheme: dark) {
      .checkbox-label input {
        background: rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.3);
      }
    }

    .btn {
      background: #0a84ff;
      color: white;
      border: none;
      padding: 10px 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      min-width: 120px;
    }

    .btn:hover { background: #006ee6; }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="window-header">
    <div class="window-title">Network Menubar</div>
  </div>
  <div class="close-btn" id="close-x"></div>

  <div class="icon">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 4 L56 28 L44 28 L44 48 L20 48 L20 28 L8 28 Z" fill="#0a84ff" stroke="#0a84ff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="32" cy="40" r="6" fill="none" stroke="#0a84ff" stroke-width="2"/>
    </svg>
  </div>

  <h1>Network Menubar</h1>
  <p class="subtitle">Shows machines on your local network in the macOS menu bar. Click the icon in your menu bar (top-right) any time to see connected devices.</p>

  <label class="checkbox-label">
    <input type="checkbox" id="dont-show">
    <span>Don't show this again</span>
  </label>

  <button class="btn" id="done-btn">Got it</button>

  <script>
    const dontShow = document.getElementById('dont-show');
    const doneBtn = document.getElementById('done-btn');
    const closeX = document.getElementById('close-x');

    function close() {
      window.api.closeWelcome(dontShow.checked);
    }

    doneBtn.addEventListener('click', close);
    closeX.addEventListener('click', close);

    // Pressing Enter or Escape closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') close();
    });
  </script>
</body>
</html>
