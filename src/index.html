<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Menubar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1c1c24;
      --bg-elev: #26263a;
      --bg-hover: #303048;
      --accent: #0a84ff;
      --accent-hover: #006ee6;
      --text: #ffffff;
      --text-dim: #8e8e9e;
      --online: #34c759;
      --offline: #ff453a;
      --border: #38384a;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --bg-elev: #ffffff;
        --bg-hover: #e8e8ed;
        --text: #000000;
        --text-dim: #6e6e7e;
        --border: #d8d8de;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .titlebar {
      height: 28px;
      -webkit-app-region: drag;
      background: transparent;
      flex-shrink: 0;
    }

    .header {
      padding: 8px 20px 16px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .stats {
      display: flex;
      gap: 10px;
      padding: 0 20px 16px;
      flex-shrink: 0;
    }

    .stat {
      flex: 1;
      background: var(--bg-elev);
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .toolbar {
      padding: 0 20px 12px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }

    .btn:hover { background: var(--bg-hover); }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-hover); }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .list-container::-webkit-scrollbar { width: 8px; }
    .list-container::-webkit-scrollbar-thumb {
      background: rgba(127,127,127,0.3);
      border-radius: 4px;
    }

    .machine {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.1s, transform 0.15s;
    }

    .machine:hover {
      background: var(--bg-hover);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--offline);
      flex-shrink: 0;
      box-shadow: 0 0 0 0 var(--online);
      transition: background 0.2s;
    }

    .machine.online .status-dot {
      background: var(--online);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.5); }
      50% { box-shadow: 0 0 0 4px rgba(52, 199, 89, 0); }
    }

    .machine-info {
      flex: 1;
      min-width: 0;
    }

    .machine-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .machine-ip {
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'SF Mono', Menlo, monospace;
    }

    .machine-actions {
      display: flex;
      gap: 6px;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .machine:hover .machine-actions { opacity: 1; }

    .icon-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .icon-btn svg { width: 14px; height: 14px; }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-dim);
    }

    .empty-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--text);
    }

    .empty-sub {
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>

  <div class="header">
    <h1>Network Menubar</h1>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="online-count">0</div>
      <div class="stat-label">Online</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-label">Total</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="refresh-btn">Refresh</button>
    <button class="btn" id="settings-btn">Settings</button>
    <button class="btn" id="update-btn" style="display:none">Update Available</button>
  </div>

  <div class="list-container" id="list-container">
    <div class="empty">
      <div class="empty-title">Scanning network</div>
      <div class="empty-sub">Looking for machines on your local network</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
