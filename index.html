<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Menubar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 1.5rem;
      color: #00d4ff;
    }
    
    .refresh-btn {
      background: #00d4ff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    .refresh-btn:hover {
      background: #00a8cc;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .stat {
      background: #16213e;
      padding: 15px 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #00d4ff;
    }
    
    .stat-label {
      font-size: 0.8rem;
      color: #888;
      margin-top: 5px;
    }
    
    .machine-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .machine {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .machine:hover {
      transform: translateX(5px);
      box-shadow: 0 2px 10px rgba(0, 212, 255, 0.2);
    }
    
    .status {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4757;
    }
    
    .status.online {
      background: #2ed573;
    }
    
    .machine-info {
      flex: 1;
    }
    
    .machine-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 3px;
    }
    
    .machine-ip {
      color: #888;
      font-size: 0.9rem;
    }
    
    .machine-type {
      background: #0f3460;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #00d4ff;
    }
    
    .machine-actions {
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      background: #0f3460;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      color: #eee;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    
    .action-btn:hover {
      background: #1a4a7a;
    }
    
    .action-btn.copy {
      background: #2ed57333;
      color: #2ed573;
    }
    
    .action-btn.copy:hover {
      background: #2ed57355;
    }
    
    .empty {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2ed573;
      color: #1a1a2e;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
    }
    
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🖥️ Network Menubar</h1>
    <button class="refresh-btn" onclick="refresh()">🔄 Refresh</button>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-label">Total Machines</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="online-count">0</div>
      <div class="stat-label">Online</div>
    </div>
  </div>
  
  <div class="machine-list" id="machine-list">
    <div class="empty">Scanning network...</div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script>
    const { api } = window;
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    async function loadMachines() {
      const machines = await api.getMachines();
      renderMachines(machines);
    }
    
    function renderMachines(machines) {
      const list = document.getElementById('machine-list');
      const totalCount = document.getElementById('total-count');
      const onlineCount = document.getElementById('online-count');
      
      totalCount.textContent = machines.length;
      onlineCount.textContent = machines.filter(m => m.online).length;
      
      if (machines.length === 0) {
        list.innerHTML = '<div class="empty">No machines found on the network</div>';
        return;
      }
      
      list.innerHTML = machines.map(m => `
        <div class="machine">
          <div class="status ${m.online ? 'online' : ''}"></div>
          <div class="machine-info">
            <div class="machine-name">${m.name || 'Unknown'}</div>
            <div class="machine-ip">${m.ip}</div>
          </div>
          <span class="machine-type">${m.type || 'ping'}</span>
          <div class="machine-actions">
            <button class="action-btn copy" onclick="copyIP('${m.ip}')">📋 Copy IP</button>
            <button class="action-btn copy" onclick="copyName('${m.name || m.ip}')">📋 Copy Name</button>
            <button class="action-btn" onclick="sshTo('${m.name || m.ip}')">🔗 SSH</button>
          </div>
        </div>
      `).join('');
    }
    
    function copyIP(ip) {
      navigator.clipboard.writeText(ip).then(() => showToast('IP copied to clipboard!')).catch(() => showToast('Failed to copy'));
    }

    function copyName(name) {
      navigator.clipboard.writeText(name).then(() => showToast('Name copied to clipboard!')).catch(() => showToast('Failed to copy'));
    }

    function sshTo(host) {
      api.openExternal(`ssh://${host}`).catch(() => showToast('Failed to open SSH'));
    }
    
    async function refresh() {
      await api.scan();
    }
    
    // Listen for updates
    api.onMachinesUpdate(renderMachines);

    // Listen for copy events from tray
    api.onCopyIP(showToast);
    api.onCopyName(showToast);

    // Listen for SSH commands from tray menu
    api.onSSH((machine) => {
      api.openExternal(`ssh://${machine.name || machine.ip}`).catch(() => showToast('Failed to open SSH'));
    });
    
    // Initial load
    loadMachines();
  </script>
</body>
</html>
